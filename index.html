<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ujian Terkunci - Wayground</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #exam-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
        #warning-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; flex-direction: column;
        }
        #warning-overlay h1 { color: #ff4444; }
    </style>
</head>
<body>

    <!-- Overlay peringatan jika siswa melanggar -->
    <div id="warning-overlay">
        <h1>⚠️ PELANGGARAN TERDETEKSI</h1>
        <p id="warning-message">Anda terdeteksi keluar dari mode ujian.</p>
        <p>Guru telah diberi tahu. Silakan kembali ke mode fullscreen.</p>
        <button onclick="requestFullscreenAndResume()">Kembali ke Ujian</button>
    </div>

    <!-- Wayground dimuat di sini -->
    <div id="exam-wrapper">
        <iframe id="wayground-frame" src="https://wayground.com/join?gc=55769525" 
                allowfullscreen style="width:100%; height:100%; border:none;">
        </iframe>
    </div>

    <script>
        // === KONFIGURASI ===
        const IFRAME_ID = 'wayground-frame';
        const OVERLAY_ID = 'warning-overlay';
        const MSG_ID = 'warning-message';
        let violationCount = 0;
        const MAX_VIOLATIONS = 3; // Batas toleransi

        const iframe = document.getElementById(IFRAME_ID);
        const overlay = document.getElementById(OVERLAY_ID);
        const msgEl = document.getElementById(MSG_ID);

        // === 1. PAKSA FULLSCREEN SAAT MULAI ===
        function startExam() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            }
            // Fokuskan ke iframe setelah fullscreen
            setTimeout(() => iframe.focus(), 1000);
        }

        // === 2. DETEKSI KELUAR FULLSCREEN ===
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                handleViolation('Anda keluar dari mode fullscreen!');
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                handleViolation('Anda keluar dari mode fullscreen!');
            }
        });

        // === 3. DETEKSI PINDAH TAB / MINIMIZE WINDOW ===
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                handleViolation('Anda berpindah tab atau meminimalkan jendela!');
            }
        });

        // === 4. BLOKIR KLIK KANAN ===
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleViolation('Klik kanan dilarang!');
        });

        // === 5. BLOKIR COPY-PASTE ===
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            handleViolation('Copy-paste dilarang!');
        });

        // === 6. DETEKSI DEVTOOLS (F12) ===
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
                e.preventDefault();
                handleViolation('Developer Tools tidak diizinkan!');
            }
        });

        // === FUNGSI PENANGANAN PELANGGARAN ===
        function handleViolation(message) {
            violationCount++;
            msgEl.textContent = `${message} (Pelanggaran: ${violationCount}/${MAX_VIOLATIONS})`;
            overlay.style.display = 'flex';

            if (violationCount >= MAX_VIOLATIONS) {
                // Aksi jika sudah melewati batas, misal: kunci total
                alert('Batas pelanggaran tercapai. Ujian dihentikan.');
                // Kamu bisa kirim log ke server di sini
                // window.location.href = '/exam-terminated';
            }
        }

        function requestFullscreenAndResume() {
            overlay.style.display = 'none';
            startExam(); // Paksa fullscreen lagi
        }

        // Mulai ujian saat halaman dimuat
        window.onload = startExam;

    </script>
</body>
</html>
